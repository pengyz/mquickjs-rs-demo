[package]
name = "mqjs-openvela-adapter"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
mquickjs-rs = { path = "../../../deps/mquickjs-rs", default-features = false, features = ["no-std"] }

[profile.dev]
