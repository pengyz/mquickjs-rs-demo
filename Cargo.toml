[workspace]
# Virtual manifest: the workspace root owns no package. The demo app (formerly
# the root package) lives at apps/demo; product crates live under deps/.
resolver = "2"

members = [
    "deps/mquickjs-sys",
    "deps/mquickjs-rs",
    "deps/ridl-tool",
    "deps/mquickjs-ridl-glue",
    "ridl-modules/stdlib",
    "deps/mquickjs-build",
    "ridl-builder",
    "apps/demo",

    "tests/global/types/test_types",
    "tests/global/literals/test_literals",
    "tests/global/fn/test_fn",
    "tests/global/js_fields/test_js_fields",
    "tests/global/class/test_class",
    "tests/global/singleton/test_singleton",
    "tests/global/import_using/test_import_using",
    "tests/global/diagnostics/test_diagnostics",
    "tests/global/require/test_require",
    "tests/global/rust_ident/test_rust_ident",
    "tests/global/gc_root_cycle/test_gc_root_cycle",
    "tests/global/gc_traced/test_gc_traced",
    "tests/global/async_test/test_async_cancellation",
    "tests/global/properties/test_properties",
    "tests/global/constants/test_constants",
    "tests/global/interface/test_interface",

    "tests/module/basic/test_module_basic",
    "tests/module/exports/test_module_single_class",
    "apps/test_app",
]

# NOTE: test RIDL modules live under tests/global/. They are workspace members but
# are not linked into the demo app by default (to avoid exposing test APIs).
